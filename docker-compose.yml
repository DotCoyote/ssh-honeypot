services:
  cowrie:
    image: cowrie/cowrie:latest
    volumes:
      - type: bind
        source: ./cowrie/etc
        target: /cowrie/cowrie-git/etc
        read_only: true
      - type: bind
        source: ./cowrie/logs
        target: /cowrie/cowrie-git/var/log/cowrie
        read_only: false
      - type: bind
        source: ./cowrie/downloads
        target: /cowrie/cowrie-git/var/lib/cowrie
        read_only: false
    ports:
      - 2222:2222/tcp

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:9.5.5
    ports:
      - 127.0.0.1:9200:9200
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - 127.0.0.1:5601:5601

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.5.5
    user: root
    volumes:
      - ./cowrie/logs:/cowrie-logs:ro
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    depends_on:
      - elasticsearch
