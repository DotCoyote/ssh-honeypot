networks:
  cowrie-net:
    driver_opts:
      com.docker.network.bridge.name: 'br-cowrie'
  elk-net:

volumes:
  es-vol:
  fb-vol:

services:
  cowrie:
    networks:
      - cowrie-net
    image: cowrie/cowrie:sha-085ed09
    volumes:
      - type: bind
        source: ./cowrie/etc
        target: /cowrie/cowrie-git/etc
        read_only: true
      - type: bind
        source: ./cowrie/logs
        target: /cowrie/cowrie-git/var/log/cowrie
        read_only: false
      - type: bind
        source: ./cowrie/downloads
        target: /cowrie/cowrie-git/var/lib/cowrie
        read_only: false
    ports:
      - '${COWRIE_PUBLIC_IP:-127.0.0.1}:22:2222'
      - '${COWRIE_PUBLIC_IP:-127.0.0.1}:23:2223'
    restart: unless-stopped

  elasticsearch:
    networks:
      - elk-net
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:9.5.5
    ports:
      - 127.0.0.1:9200:9200
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - es-vol:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    networks:
      - elk-net
    image: docker.elastic.co/kibana/kibana:9.5.5
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - 127.0.0.1:5601:5601
    restart: unless-stopped

  filebeat:
    networks:
      - elk-net
    image: docker.elastic.co/beats/filebeat:9.5.5
    user: root
    volumes:
      - ./cowrie/logs:/cowrie-logs:ro
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - fb-vol:/usr/share/filebeat/data
    depends_on:
      - elasticsearch
    restart: unless-stopped
